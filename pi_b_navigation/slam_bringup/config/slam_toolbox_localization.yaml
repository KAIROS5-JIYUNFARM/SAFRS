slam_toolbox:
  ros__parameters:

    map_frame: map
    odom_frame: odom
    base_frame: base_footprint

    scan_topic: /scan

    mode: localization
    publish_map: true
    publish_pose: true
    scan_queue_size: 100
    throttle_scans: 1
    transform_timeout: 0.5

    transform_publish_period: 0.02
    transform_timeout: 0.5

    resolution: 0.05
    max_laser_range: 12.0

    use_scan_matching: true
    do_loop_closing: false
    map_start_at_dock: true
